default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: billing_api_development

test:
  <<: *default
  database: billing_api_test

production:
  <<: *default
  database: billing_api_production
  username: billing_api
  password: <%= ENV['BILLING_API_DATABASE_PASSWORD'] %>
